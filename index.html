<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Asistente</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#2f6fed">
<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#1c2230;--mut:#6b7488;--acc:#2f6fed;--me:#2f6fed;--meink:#fff;--line:#e3e6ee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10131a;--card:#1a1f2b;--ink:#e8ecf5;--mut:#8b94a8;--line:#2a3142}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;max-width:720px;margin:0 auto}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
#face{position:relative;font-size:76px;width:1em;height:1em;flex:none;transition:font-size .3s}
#head,#sym{position:absolute;inset:0}
#head{transform-origin:50% 90%}
#sym{pointer-events:none}
#sym::before,#sym::after{position:absolute;display:none}
#face img{position:absolute;inset:0;width:100%;height:100%;opacity:0;pointer-events:none;user-select:none}
header h1{font-size:1.05rem;margin:0}
#status{color:var(--mut);font-size:.85rem}
#demo,#clear{background:none;border:1px solid var(--line);color:var(--mut);border-radius:8px;padding:6px 10px;font:inherit;font-size:.85rem}
#demo{margin-left:auto}
body.demo header{flex-direction:column;text-align:center}
body.demo #face{font-size:min(68vw,250px)}
body.demo #status{font-size:1.15rem;color:var(--ink)}
body.demo #demo,body.demo #clear{margin:0}
#log{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px}
.m{max-width:85%;padding:9px 13px;border-radius:16px;white-space:pre-wrap;overflow-wrap:anywhere;background:var(--card);border:1px solid var(--line)}
.m.me{align-self:flex-end;background:var(--me);color:var(--meink);border-color:var(--me)}
#f{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line)}
input{flex:1;font:inherit;padding:11px 14px;border-radius:22px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
button.send{border:0;border-radius:22px;padding:0 18px;background:var(--acc);color:#fff;font:inherit}
button:disabled{opacity:.5}
#sym.s-confused::before,#sym.s-amazed::before{display:block;right:-.02em;top:-.04em;font:700 .36em/1 system-ui,sans-serif}
#sym.s-confused::before{content:'?';color:var(--acc);animation:floatq 2s ease-in-out infinite}
#sym.s-amazed::before{content:'!';color:#e0842b;animation:popsym .5s ease-out both}
#sym.s-sad::after{display:block;content:'';left:37%;top:44%;width:.045em;height:.07em;background:#6ab7ff;border-radius:50% 50% 50% 50%/65% 65% 35% 35%;animation:drip 2.2s infinite}
.mv-idle #head{animation:breathe 4s ease-in-out infinite}
.mv-thinking #head{animation:sway 3s ease-in-out infinite}
.mv-confused #head{animation:wobble 2.4s ease-in-out infinite}
.mv-amazed #head{animation:pop .5s ease-out both}
.mv-sad #head{animation:sink 3.5s ease-in-out infinite}
.mv-happy #head{animation:hop .5s ease-in-out 3}
.mv-speaking #head{animation:bob .4s ease-in-out infinite alternate}
.dots{animation:pulse 1s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.015) translateY(-.4%)}}
@keyframes sway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2.5deg)}}
@keyframes wobble{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(-3.5deg)}}
@keyframes pop{0%{transform:scale(1)}30%{transform:scale(1.12)}100%{transform:scale(1.03)}}
@keyframes sink{0%,100%{transform:translateY(3%)}50%{transform:translateY(4%)}}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-5%)}}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-1.5%)}}
@keyframes floatq{0%,100%{transform:translateY(0) rotate(-8deg)}50%{transform:translateY(-.03em) rotate(8deg)}}
@keyframes popsym{0%{transform:scale(0)}60%{transform:scale(1.3)}100%{transform:scale(1)}}
@keyframes drip{0%{transform:translateY(0);opacity:0}15%{opacity:1}85%{transform:translateY(.16em);opacity:1}100%{transform:translateY(.2em);opacity:0}}
@keyframes pulse{50%{opacity:.35}}
</style>
</head>
<body>
<header>
  <div id="face" role="img" aria-label="Carita del asistente"><div id="head"></div><span id="sym"></span></div>
  <div><h1 id="name">Asistente</h1><div id="status">listo</div></div>
  <button id="demo" type="button">▶ Caras</button>
  <button id="clear" type="button">Borrar</button>
</header>
<div id="log" aria-live="polite"></div>
<div id="f">
  <input id="q" placeholder="Escribe tu duda…" enterkeyhint="send" autocomplete="off">
  <button class="send" id="go" type="button">Enviar</button>
</div>

for(const k in FRAMES){const im=new Image();im.src=DATA[k];im.alt='';head.appendChild(im);imgs[k]=im}
function show(k,ms=160){
  const el=imgs[k];if(!el||el===cur)return;
  const prev=cur;cur=el;
  el.style.transition='none';el.style.opacity=0;el.style.zIndex=++zi;void el.offsetWidth;
  el.style.transition='opacity '+ms+'ms';el.style.opacity=1;
  if(prev)setTimeout(()=>{if(prev!==cur)prev.style.opacity=0},ms+40);
}
function fx(m){face.className='';sym.className='';void face.offsetWidth;if(m){face.className='mv-'+m;sym.className='s-'+m}}
function setState(s){mode=s;st.textContent=LABEL[s];show(STATE_FRAME[s]||'neutral',s==='idle'?160:200);fx(MOVE[s])}
async function blinkLoop(){
  while(true){
    await sleep(2200+Math.random()*3200);
    if(mode!=='idle')continue;
    for(const k of ['half','closed','half','neutral']){if(mode!=='idle')break;show(k,40);await sleep(70)}
    if(mode==='idle')show('neutral',60);
  }
}
function add(role,text){const d=document.createElement('div');d.className='m'+(role==='user'?' me':'');d.textContent=text;log.appendChild(d);log.scrollTop=log.scrollHeight;return d}
function greet(){add('assistant',CONFIG.welcome);if(!CONFIG.API_URL)add('assistant','Modo de prueba: escribe un número del 1 al 12 para ver cada cara (el 11 está descartado).')}
function save(){try{localStorage.setItem('hist',JSON.stringify(hist.slice(-60)))}catch(e){}}
function load(){try{hist=JSON.parse(localStorage.getItem('hist')||'[]')}catch(e){hist=[]}}
async function ask(){
  if(!CONFIG.API_URL){await sleep(1300);return "Modo demo: aún no hay backend conectado. Pero mira mi carita mientras pienso y contesto 🙂"}
  const r=await fetch(CONFIG.API_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:hist.slice(-CONFIG.KEEP)})});
  if(!r.ok)throw new Error(r.status);
  return (await r.json()).reply||'(sin respuesta)';
}
async function type(el,text){
  el.classList.remove('dots');setState('speaking');
  const D=Math.min(Math.max(text.length*38,1200),8000),t0=performance.now();let n=0,open=false;
  while(true){
    const p=Math.min((performance.now()-t0)/D,1),idx=Math.ceil(p*text.length);
    el.textContent=text.slice(0,idx);log.scrollTop=log.scrollHeight;
    if(n++%2===0){open=!open;show(open?'mouth1':'neutral',60)}
    if(p>=1)break;await sleep(70);
  }
  el.textContent=text;
}
async function test(n){
  busy=true;$('#go').disabled=true;add('user',String(n));
  const k=NUM[n];
  if(!k)add('assistant','El 11 no está en la app (cansado descartado). Prueba del 1 al 10 o el 12.');
  else{mode='test';show(k,200);fx(FRAME_MOVE[k]||'');st.textContent=n+' · '+FRAMES[k];add('assistant','Imagen '+n+': '+FRAMES[k]);await sleep(4000);setState('idle')}
  busy=false;$('#go').disabled=false;$('#q').focus();
}
async function send(){
  if(busy)return;
  const t=$('#q').value.trim();if(!t)return;
  $('#q').value='';
  if(/^\d{1,2}$/.test(t)&&+t>=1&&+t<=12)return test(+t);
  busy=true;$('#go').disabled=true;
  add('user',t);hist.push({role:'user',content:t});
  setState('thinking');
  const el=add('assistant','…');el.classList.add('dots');
  try{
    const reply=await ask();
    await type(el,reply);hist.push({role:'assistant',content:reply});save();
    setState('happy');await sleep(1600);
  }catch(err){el.textContent='No pude conectarme. Intenta de nuevo.';hist.pop();}
  setState('idle');busy=false;$('#go').disabled=false;$('#q').focus();
}
async function demo(){
  if(demoOn){demoOn=false;return}
  if(busy)return;
  demoOn=true;busy=true;mode='test';document.body.classList.add('demo');$('#demo').textContent='■ Detener';
  for(let i=0;i<SERIES.length&&demoOn;i++){
    const n=SERIES[i],k=NUM[n];show(k,250);fx(FRAME_MOVE[k]||'');st.textContent=(i+1)+'/'+SERIES.length+' · '+n+' · '+FRAMES[k];
    for(let t=0;t<24&&demoOn;t++)await sleep(100);
  }
  demoOn=false;busy=false;document.body.classList.remove('demo');$('#demo').textContent='▶ Caras';setState('idle');
}
$('#go').onclick=send;
$('#q').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();send()}});
$('#demo').onclick=demo;
$('#clear').onclick=()=>{hist=[];save();log.innerHTML='';greet()};
$('#name').textContent=CONFIG.name;document.title=CONFIG.name;
load();show('neutral',0);fx('idle');blinkLoop();
if(hist.length)hist.forEach(m=>add(m.role,m.content));else greet();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
